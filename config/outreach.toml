# How Clinic Growth writes to clinics. Your name, address and mailboxes are NOT here: they are in settings.txt on
# your device ( cg settings ). After a change here, the tablet takes it with  cg update .

[email]
enabled = true
# Follow-ups: days after the first e-mail. Any reply stops them. They count towards each mailbox's daily limit:
# with [3, 7] every new clinic costs up to 3 e-mails, so 500 a day reaches about 170 new clinics a day.
follow_up_days = [3, 7]
# The clinic's own working hours, in its own time zone, on its working days.
window_start = "09:30"
window_end = "17:30"
days = ["mon", "tue", "wed", "thu", "fri"]
day_tz = "Asia/Kolkata"   # the "day" of the daily limits
# Nothing goes out on these dates (fixed public holidays in India; add festival dates as they come up).
skip_dates = ["2026-12-25", "2027-01-01", "2027-01-26", "2027-08-15", "2027-10-02", "2027-12-25"]
# The kinds of practice written to first (one kept appointment is worth most to them).
boost_categories = ["dental", "skin", "eye", "fertility_women", "ortho_physio"]
# Found for the hospital-doctor search, never written to. A hospital's own "find a doctor" listings are
# skipped as well, whatever their category (clinicreach/outreach/engine.py).
exclude_categories = ["hospital"]
min_gap_seconds = 45      # between two e-mails from the same mailbox, at least
max_gap_seconds = 240

# The warm-up: the most e-mails ONE mailbox may send on its 1st, 2nd, 3rd ... good sending day.
# 50, 100, 200, then up to 500. A mailbox only moves up after a day that went well (see
# docs/DELIVERABILITY.md), and a brake holds or lowers it by itself.
[ramp]
gmail = [50, 100, 200, 250, 300, 350, 400, 450, 500]
# A new Outlook.com account may send far less (Microsoft gives no figure; about 300 a day once it is trusted).
outlook = [20, 40, 60, 90, 120, 160, 200, 250, 300]
smtp = [30, 60, 100, 150, 200, 250, 300, 400, 500]

[ramp.max_24h]
gmail = 480               # Gmail stops a free account for a day at 500 in ANY 24 hours; 20 are kept for your own replies
outlook = 280
smtp = 480

[auto_reply]
enabled = true            # a plain "yes, send it" gets the overview PDF back at once, in the same conversation
attachment = "marketing/brochure.pdf"
