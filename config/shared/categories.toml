# The kinds of practice we look for, shared by every city (include = ["../shared/categories.toml"]).
#
#   overture  category codes in the Overture Maps open data. Codes that do not exist simply match nothing.
#   osm       OpenStreetMap tags (the fallback when the open data cannot be read)
#   queries / match   search words and labels
#
# The overture codes below were written from memory of the Overture category list and have not been
# checked against a live download yet: after the first real run, compare the counts per category.

[[categories]]
key = "dental"
label = "Dental clinic"
queries = ["dental clinic", "dentist"]
match = ["dental", "dentist", "dentistry", "orthodont*", "implant", "smile", "endodont*", "periodont*"]
osm = ['["amenity"="dentist"]', '["healthcare"="dentist"]']
overture = ["dentist", "general_dentistry", "cosmetic_dentist", "orthodontist", "pediatric_dentist", "periodontist",
            "endodontist", "oral_surgeon", "prosthodontist", "dental_hygienist"]

[[categories]]
key = "skin"
label = "Skin / Hair / Cosmetic clinic"
queries = ["skin clinic", "dermatologist", "cosmetic clinic"]
match = ["dermat*", "skin", "cosmet*", "aesthetic*", "hair transplant", "laser", "plastic surg*", "trichology"]
osm = ['["healthcare:speciality"~"dermatology|plastic_surgery"]']
overture = ["dermatologist", "cosmetic_surgeon", "plastic_surgeon", "hair_loss_center", "laser_hair_removal",
            "medical_spa", "skin_care"]

[[categories]]
key = "eye"
label = "Eye clinic"
queries = ["eye clinic", "ophthalmologist"]
match = ["eye", "ophthalm*", "lasik", "retina", "vision", "netralaya", "optometr*"]
osm = ['["healthcare"="optometrist"]', '["healthcare:speciality"="ophthalmology"]']
overture = ["ophthalmologist", "eye_care_clinic", "optometrist", "laser_eye_surgery_lasik"]

[[categories]]
key = "fertility_women"
label = "Fertility / Women's clinic"
queries = ["fertility clinic", "IVF centre", "gynecologist"]
match = ["fertility", "ivf", "gyn*", "obstet*", "maternity", "women", "infertility"]
osm = ['["healthcare:speciality"~"gynaecology|fertility"]']
overture = ["fertility", "obstetrician_and_gynecologist", "reproductive_health_services", "maternity_centers"]

[[categories]]
key = "ortho_physio"
label = "Orthopaedic / Physiotherapy clinic"
queries = ["orthopedic clinic", "physiotherapy clinic"]
match = ["orthop*", "physio*", "spine", "joint", "sports medicine", "rehab*", "chiropract*", "bone"]
osm = ['["healthcare"="physiotherapist"]', '["healthcare:speciality"~"orthopaedics|physiotherapy"]']
overture = ["orthopedist", "physical_therapy", "sports_medicine", "chiropractor", "rehabilitation_center"]

[[categories]]
key = "doctor"
label = "Doctor's clinic"
queries = ["doctor clinic", "physician", "child specialist", "ENT clinic"]
match = ["doctor", "dr", "physician", "pediatric*", "paediatric*", "child", "ent", "cardio*", "diabet*", "neuro*",
         "gastro*", "urolog*", "psychiatr*", "chest", "medicine"]
osm = ['["amenity"="doctors"]', '["healthcare"="doctor"]']
overture = ["doctor", "family_practice", "internal_medicine", "pediatrician", "ear_nose_and_throat", "cardiologist",
            "endocrinologist", "gastroenterologist", "neurologist", "urologist", "psychiatrist", "pulmonologist",
            "rheumatologist", "allergist", "nephrologist", "diabetologist", "general_practitioner"]

[[categories]]
key = "clinic"
label = "Clinic / Polyclinic"
queries = ["clinic", "polyclinic", "medical centre"]
match = ["clinic", "polyclinic", "medical centre", "medical center", "health centre", "health center", "nursing home"]
osm = ['["amenity"="clinic"]', '["healthcare"~"clinic|centre"]']
overture = ["medical_center", "urgent_care_clinic", "walk_in_clinic"]

# Hospitals are not leads. They are kept so their "our doctors" pages can be read into a roster
# (python -m clinicleads hospitals ...), which is then matched against the private clinics above.
[[categories]]
key = "hospital"
label = "Hospital (roster source)"
queries = ["hospital", "multispeciality hospital"]
match = ["hospital", "hospitals", "medical college", "institute of medical"]
osm = ['["amenity"="hospital"]']
overture = ["hospital"]
